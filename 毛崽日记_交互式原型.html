<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>毛崽日记</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#FFF8EE;--primary:#E87A5D;--primary-d:#D4684A;--dark:#3D2817;--muted:#8B7355;--light:#A0815F;--border:#F0E4CE;--border2:#EDE4D3;--card:#FFFFFF;--accent:#FFF1DC;--accent2:#FAF3E8;--error:#E85D5D;--success:#5DAF6B;--warn:#C4852A;--radius:14px}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#E8D5B5;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:393px;height:100vh;max-height:852px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:394px){#app{border-radius:44px;box-shadow:0 0 60px rgba(0,0,0,.25);height:852px}}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.page.no-scroll{overflow:hidden}
.page::-webkit-scrollbar{display:none}
/* statusbar */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-size:13px;font-weight:600;color:var(--dark);flex-shrink:0}
.statusbar-r{display:flex;gap:5px;align-items:center}
/* navbar */
.navbar{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 10px;flex-shrink:0}
.nav-title{font-size:17px;font-weight:600;color:var(--dark)}
.nav-back{display:flex;align-items:center;cursor:pointer}
.nav-right{display:flex;gap:14px;align-items:center}
.nav-text{font-size:13px;color:var(--light);cursor:pointer}
.nav-text.primary{color:var(--primary);font-weight:500}
.nav-dot{position:absolute;top:-2px;right:-4px;width:7px;height:7px;background:var(--primary);border-radius:50%;border:1.2px solid var(--bg)}
.nav-dot-wrap{position:relative}
/* tabbar */
.tabbar{display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--border);padding:6px 6px 18px;flex-shrink:0}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;cursor:pointer}
.tab-label{font-size:10px;color:var(--muted)}
.tab-item.on .tab-label{color:var(--primary);font-weight:600}
.tab-create{width:48px;height:48px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);box-shadow:0 2px 8px rgba(232,122,93,.3)}
/* content area */
.content{padding:0 0 20px}
.section{padding:16px 20px 0}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-hdr h2{font-size:15px;font-weight:600;color:var(--dark)}
.section-more{font-size:12px;color:var(--light);display:flex;align-items:center;gap:3px;cursor:pointer}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
/* pet switcher */
.pet-cards{display:flex;gap:10px}
.pet-card{flex:1;background:var(--card);border-radius:16px;padding:10px 8px;display:flex;align-items:center;gap:8px;cursor:pointer;border:2px solid transparent}
.pet-card.on{border:2px solid var(--primary)}
.pet-card.off{border:1.5px solid var(--border2)}
.pet-card.add{background:var(--accent2);border:1.5px dashed #D3B98C}
.pet-av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#F5DCC2}
.pet-av img{width:100%;height:100%;object-fit:cover}
.pet-nm{font-size:13px;font-weight:500}
.pet-nm.on{color:var(--dark)}.pet-nm.off{color:var(--muted)}.pet-nm.add{color:var(--light)}
.pet-bd{font-size:11px;color:var(--light);margin-top:1px}
/* selected info bar */
.info-bar{padding:10px 20px 12px;background:var(--accent);border-top:1px solid #F0DDB5;border-bottom:1px solid #F0DDB5}
.info-bar .t{font-size:13px;color:#5C3D2E}
.info-bar .t .lbl{color:var(--muted)}.info-bar .t .nm{font-weight:500;color:var(--dark)}
.info-bar .st{font-size:11px;color:var(--light);margin-top:3px;display:flex;align-items:center;gap:4px}
.info-bar .st .dot{width:6px;height:6px;background:var(--primary);border-radius:50%}
/* diary list item */
.diary-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.diary-av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#FFE6D5}
.diary-av img{width:100%;height:100%;object-fit:cover}
.diary-info{flex:1;min-width:0}
.diary-tt{font-size:13px;font-weight:500;color:var(--dark)}
.diary-tm{font-size:11px;color:var(--light);margin-top:2px}
/* feed card */
.feed-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:0 20px 14px}
.feed-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feed-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid #F0DDB5;background:#F5DCC2}
.feed-av img{width:100%;height:100%;object-fit:cover}
.feed-user{flex:1;min-width:0}
.feed-nm{font-size:13px;font-weight:500;color:var(--dark)}
.feed-meta{font-size:11px;color:var(--light);margin-top:1px}
.style-tag{font-size:10px;padding:3px 8px;border-radius:10px;background:var(--accent);color:var(--warn);font-weight:500;flex-shrink:0}
.feed-text{font-size:13px;color:#5C3D2E;line-height:1.6;margin-bottom:10px}
.feed-text .fp{color:var(--primary);font-weight:500}
.feed-imgs{display:flex;gap:6px;margin-bottom:10px}
.feed-img{flex:1;height:90px;border-radius:10px;overflow:hidden;background:#F5E8D0}
.feed-img img{width:100%;height:100%;object-fit:cover}
.feed-acts{display:flex;gap:20px;align-items:center}
.feed-act{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.feed-act.on{color:var(--primary)}
/* sub tabs */
.sub-tabs{display:flex;padding:0 20px;gap:24px;border-bottom:1px solid var(--border);flex-shrink:0}
.sub-tab{font-size:14px;color:var(--muted);padding:10px 0 12px;position:relative;cursor:pointer}
.sub-tab.on{color:var(--dark);font-weight:600}
.sub-tab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--primary);border-radius:2px}
/* chips */
.chips{display:flex;gap:8px;padding:12px 20px 10px;overflow-x:auto;flex-shrink:0}
.chip{font-size:12px;padding:6px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.on{background:var(--primary);color:#fff;font-weight:500}
.chip.off{background:var(--accent2);color:var(--muted);border:1px solid var(--border)}
/* create page */
.create-sec{padding:14px 20px 0}
.create-lbl{font-size:13px;font-weight:500;color:var(--dark);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.create-lbl .sub{font-size:11px;color:var(--light);font-weight:400}
.pet-sel-row{display:flex;gap:10px;overflow-x:auto}
.pet-sel-card{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:8px 12px;flex-shrink:0;cursor:pointer}
.pet-sel-card.on{border:2px solid var(--primary);background:var(--accent)}
.pet-sel-card .ps-av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#F5DCC2}
.pet-sel-card .ps-av img{width:100%;height:100%;object-fit:cover}
.ps-nm{font-size:12px;font-weight:500;color:var(--dark)}
.ps-bd{font-size:10px;color:var(--light)}
.textarea-box{background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:14px;min-height:100px;position:relative}
.textarea-box textarea{width:100%;border:none;outline:none;background:transparent;font-size:13px;color:var(--dark);font-family:inherit;resize:none;line-height:1.6}
.textarea-box .ph{font-size:13px;color:#C4A87A;line-height:1.6}
.char-count{position:absolute;bottom:8px;right:12px;font-size:11px;color:#C4A87A}
.upload-grid{display:flex;gap:8px}
.upload-item{width:72px;height:72px;border-radius:12px;background:#F5E8D0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.upload-item img{width:100%;height:100%;object-fit:cover}
.upload-item.add{background:var(--accent2);border:1.5px dashed #D3B98C;cursor:pointer}
.upload-item .rmv{position:absolute;top:3px;right:3px;width:16px;height:16px;background:rgba(0,0,0,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.style-tags{display:flex;gap:8px;flex-wrap:wrap}
.st-tag{font-size:12px;padding:7px 14px;border-radius:20px;cursor:pointer}
.st-tag.on{background:var(--primary);color:#fff;font-weight:500}
.st-tag.off{background:var(--accent2);color:var(--muted);border:1px solid var(--border)}
.gen-btn{width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;font-size:15px;font-weight:600;text-align:center;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(232,122,93,.3)}
.gen-btn:disabled{opacity:.5}
.btn{padding:12px;border-radius:14px;font-size:14px;font-weight:500;text-align:center;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-ghost{background:var(--accent2);color:var(--muted)}
.btn-full{width:100%}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
/* messages */
.msg-entry{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #F8F0E0;cursor:pointer}
.msg-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid #F0DDB5;background:#F5DCC2;position:relative}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av .sys-ic{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;background:var(--primary);border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.msg-c{flex:1;min-width:0}
.msg-nm{font-size:14px;font-weight:500;color:var(--dark)}
.msg-pv{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-tm{font-size:11px;color:#C4A87A;flex-shrink:0}
.msg-badge{background:var(--primary);color:#fff;font-size:10px;font-weight:600;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.msg-divider{padding:10px 20px 6px;font-size:12px;color:var(--light);font-weight:500}
.msg-entry.unread{background:var(--bg)}
/* quick entries */
.quick-row{display:flex;padding:12px 20px 8px;gap:0}
.quick-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative}
.quick-ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px}
.quick-nm{font-size:11px;color:var(--dark);font-weight:500}
.quick-badge{position:absolute;top:-2px;right:calc(50% - 34px);background:var(--primary);color:#fff;font-size:9px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* profile */
.prof-hdr{padding:18px 20px 16px;display:flex;align-items:center;gap:14px}
.prof-av{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2.5px solid #F0DDB5;flex-shrink:0;background:#F5DCC2}
.prof-av img{width:100%;height:100%;object-fit:cover}
.prof-info{flex:1}
.prof-nm{font-size:17px;font-weight:600;color:var(--dark)}
.prof-bio{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.prof-edit{font-size:12px;padding:6px 14px;border-radius:20px;background:var(--accent);color:var(--warn);border:1px solid #F0DDB5;font-weight:500;cursor:pointer}
.stats-row{display:flex;padding:0 20px 16px;gap:0}
.stat-it{flex:1;text-align:center;position:relative;cursor:pointer}
.stat-it:not(:last-child)::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:1px;height:24px;background:var(--border)}
.stat-num{font-size:18px;font-weight:600;color:var(--dark)}
.stat-lbl{font-size:11px;color:var(--light);margin-top:2px}
.menu-list{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:0 20px 12px}
.menu-it{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #F8F0E0;cursor:pointer}
.menu-it:last-child{border-bottom:none}
.menu-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.menu-tt{flex:1;font-size:14px;font-weight:500;color:var(--dark)}
.menu-sub{font-size:11px;color:var(--light);margin-top:1px}
.menu-badge{font-size:11px;background:#FFE6D5;color:var(--primary);padding:3px 8px;border-radius:10px;font-weight:500}
.menu-arr{color:#D3B98C}
/* auth */
.auth-wrap{display:flex;flex-direction:column;align-items:center;padding:0 28px;flex:1}
.auth-logo{width:64px;height:64px;border-radius:16px;object-fit:cover;border:2px solid #F0DDB5;margin-top:16px}
.auth-name{font-size:22px;font-weight:600;color:var(--dark);margin-top:10px;letter-spacing:1px}
.auth-h{font-size:18px;font-weight:600;color:var(--dark);margin-top:20px;align-self:flex-start}
.auth-sub{font-size:13px;color:var(--muted);margin-top:4px;align-self:flex-start;line-height:1.5}
.input-grp{width:100%;margin-top:16px}
.input-lbl{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.input-fld{width:100%;height:46px;background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:10px;position:relative}
.input-fld.on{border-color:var(--primary);box-shadow:0 0 0 3px rgba(232,122,93,.1)}
.input-fld.err{border-color:var(--error);box-shadow:0 0 0 3px rgba(232,93,93,.08)}
.input-fld input{border:none;outline:none;background:transparent;font-size:15px;color:var(--dark);flex:1;font-family:inherit}
.input-fld .ph{font-size:14px;color:#C4A87A}
.err-msg{font-size:12px;color:var(--error);margin-top:5px;display:flex;align-items:center;gap:4px}
.ok-msg{font-size:12px;color:var(--success);margin-top:5px;display:flex;align-items:center;gap:4px}
.code-row{display:flex;gap:8px;margin-top:4px}
.code-box{flex:1;height:48px;background:var(--card);border:1.5px solid var(--border2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--dark)}
.code-box.on{border-color:var(--primary);box-shadow:0 0 0 3px rgba(232,122,93,.1)}
.code-box.filled{border-color:var(--primary)}
.code-box.err{border-color:var(--error)}
/* step indicator */
.steps{display:flex;align-items:center;padding:16px 28px 0;gap:0}
.step{display:flex;align-items:center;flex:1}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.step-circle.done{background:var(--success);color:#fff}
.step-circle.cur{background:var(--primary);color:#fff}
.step-circle.todo{background:var(--accent2);color:var(--light)}
.step-line{flex:1;height:2px;background:var(--border2);margin:0 4px}
.step-line.done{background:var(--success)}
.step-lbl{font-size:10px;color:var(--light);margin-top:4px;text-align:center;white-space:nowrap}
.step-lbl.cur{color:var(--primary);font-weight:500}
/* chat */
.chat-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.chat-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word}
.chat-bubble.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.other{background:var(--card);color:var(--dark);align-self:flex-start;border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-input-bar{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.chat-input-bar input{flex:1;height:36px;border:1.5px solid var(--border2);border-radius:18px;padding:0 14px;font-size:14px;outline:none;background:var(--bg);font-family:inherit}
/* modal */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;animation:fadein .2s}
.overlay.center{align-items:center}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:80%;overflow-y:auto;animation:slideup .25s ease-out}
.sheet.center{border-radius:20px;margin:0 24px;animation:scalein .2s}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
.sheet-tt{font-size:16px;font-weight:600;color:var(--dark)}
.sheet-close{font-size:13px;color:var(--light);cursor:pointer;padding:4px 8px}
.sheet-body{padding:0 20px 24px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes scalein{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideout{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes fadein2{from{opacity:0}to{opacity:1}}
.page-anim{animation:slidein .25s ease-out}
.page-anim-back{animation:slideout .2s ease-out}
.page-anim-fade{animation:fadein2 .2s ease-out}
/* toast */
.toast-wrap{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;padding:0 20px}
.toast{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;animation:fadein2 .2s;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:100%}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--error);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.info{background:var(--dark);color:#fff}
/* state components */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;text-align:center}
.state-ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
.state-tt{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:6px}
.state-desc{font-size:13px;color:var(--muted);line-height:1.6}
/* loading skeleton */
.skel{background:linear-gradient(90deg,var(--accent2) 25%,var(--accent) 50%,var(--accent2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;margin-bottom:8px}
.skel-circle{width:40px;height:40px;border-radius:50%}
/* misc */
.divider{height:8px;background:var(--accent2);flex-shrink:0}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(18px)}
.pwd-strength{display:flex;gap:4px;margin-top:6px}
.pwd-bar{flex:1;height:4px;border-radius:2px;background:var(--border2)}
.pwd-bar.s1{background:var(--error)}.pwd-bar.s2{background:var(--warn)}.pwd-bar.s3{background:var(--success)}
.heart-anim{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.loading-spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.third-login{display:flex;justify-content:center;gap:30px;margin-top:24px}
.third-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}

// ===== HELPERS =====
function $(id) { return document.getElementById(id); }
function toast(type, msg) {
  var icons = {success:'✓',error:'✕',warn:'!',info:'i'};
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span style="font-size:16px">' + (icons[type]||'') + '</span><span>' + msg + '</span>';
  var wrap = $('toastWrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    $('app').appendChild(wrap);
  }
  wrap.appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 1800);
  setTimeout(function() { el.remove(); }, 2200);
}

function nav(screen, params) {
  S.navStack.push({screen: S.screen, params: S.navParams || {}});
  S.screen = screen;
  S.navParams = params || {};
  render('push');
}

function back() {
  if (S.navStack.length > 0) {
    var prev = S.navStack.pop();
    S.screen = prev.screen;
    S.navParams = prev.params;
    render('pop');
  } else if (S.activeTab >= 0) {
    switchTab(S.activeTab);
  }
}

function switchTab(idx) {
  var screens = ['home','community','create','messages','profile'];
  if (idx === 2) { nav('create'); return; }
  S.activeTab = idx;
  S.screen = screens[idx];
  S.navStack = [];
  S.navParams = {};
  render('fade');
}

function showModal(name, params) {
  S.modal = name;
  S.modalParams = params || {};
  render();
}

function hideModal() {
  S.modal = null;
  S.modalParams = null;
  render();
}

function toggleLike(feedIdx) {
  var key = 'feed_' + feedIdx;
  S.likes[key] = !S.likes[key];
  if (S.likes[key]) {
    S.communityFeed[feedIdx].likes++;
    toast('success','已点赞');
  } else {
    S.communityFeed[feedIdx].likes--;
  }
  render('fade');
}

function toggleFavorite(diaryKey) {
  S.favorites[diaryKey] = !S.favorites[diaryKey];
  if (S.favorites[diaryKey]) {
    toast('success','已收藏到收藏夹');
  } else {
    toast('info','已取消收藏');
  }
  render('fade');
}

function selectPet(idx) {
  S.selectedPet = idx;
  render('fade');
}

function setCreateStyle(idx) {
  S.createData.style = idx;
  render('fade');
}

function addPhoto() {
  var photos = ['咪咪叼拖鞋.jpg','咪咪叼拖鞋舔毛.jpg','布丁追蝴蝶1.jpg','布丁追蝴蝶2.jpg','年糕打打滚.jpg'];
  if (S.createData.photos.length < 9) {
    S.createData.photos.push(photos[S.createData.photos.length % photos.length]);
    render('fade');
  }
}

function removePhoto(idx) {
  S.createData.photos.splice(idx, 1);
  render('fade');
}

function doGenerate() {
  if (!S.createData.desc.trim()) { toast('error','请先描述宠物行为'); return; }
  if (S.createData.photos.length === 0) { toast('error','请至少上传一张照片'); return; }
  S.generateVersion = 1;
  S.editingDiary = null;
  nav('createResult');
}

function doRegenerate() {
  S.regenLoading = true;
  render('fade');
  setTimeout(function() {
    S.generateVersion++;
    S.createData.style = (S.createData.style + 1) % S.styles.length;
    S.regenLoading = false;
    S.editingDiary = null;
    render('fade');
    toast('success','新版本已生成');
  }, 2000);
}

function saveDraft() {
  toast('success','已保存到草稿箱');
  setTimeout(function() { back(); }, 800);
}

function getDiaryTitle() {
  if (S.editingDiary && S.editingDiary.title) return S.editingDiary.title;
  return S.styleTexts[S.createData.style].title;
}

function getDiaryText() {
  if (S.editingDiary && S.editingDiary.text) return S.editingDiary.text;
  return S.styleTexts[S.createData.style].text;
}

function getDiaryPhotos() {
  if (S.editingDiary && S.editingDiary.photos) return S.editingDiary.photos;
  return S.createData.photos;
}

function sendChat() {
  if (!S.chatInput.trim()) return;
  S.chatMessages.push({sender:'me', text: S.chatInput});
  S.chatInput = '';
  render('fade');
  setTimeout(function() {
    S.chatMessages.push({sender:'other', text:'哈哈，你家毛孩子也太可爱了吧！'});
    render('fade');
    var ca = $('chatArea');
    if (ca) ca.scrollTop = ca.scrollHeight;
  }, 1500);
}

// ===== RENDER ENGINE =====
function render(anim) {
  var app = $('app');
  // Remove existing toast wrap to preserve it
  var existingToast = $('toastWrap');
  var toastHTML = existingToast ? existingToast.outerHTML : '';
  if (existingToast) existingToast.remove();
  
  var html = '';
  
  // Toast container
  html += '<div id="toastWrap" class="toast-wrap"></div>';
  
  // Main content
  var screenFn = SCREENS[S.screen];
  var result;
  if (screenFn) {
    result = screenFn();
  } else {
    result = { html: stateBox('error', '页面不存在', '找不到页面：' + S.screen, '返回', function(){ back(); }) };
  }
  
  var animClass = anim === 'push' ? 'page-anim' : anim === 'pop' ? 'page-anim-back' : 'page-anim-fade';
  var showTabbar = result.tabbar !== false && S.navStack.length === 0;
  var hideTabbarScreens = ['login','register','forgotPassword','create','createResult','editDiary','chat'];
  if (hideTabbarScreens.indexOf(S.screen) >= 0) showTabbar = false;
  
  html += '<div class="' + animClass + '" style="display:flex;flex-direction:column;flex:1;overflow:hidden">';
  html += '<div class="page' + (result.noScroll ? ' no-scroll' : '') + '">';
  html += result.html;
  html += '</div>';
  if (showTabbar) {
    html += tabBar();
  }
  html += '</div>';
  
  // Modal overlay
  if (S.modal && MODALS[S.modal]) {
    html += MODALS[S.modal]();
  }
  
  app.innerHTML = html;
  
  // Scroll chat to bottom
  if (S.screen === 'chat') {
    var ca = $('chatArea');
    if (ca) ca.scrollTop = ca.scrollHeight;
  }
}

function tabBar() {
  var tabs = [
    {ic: IC.home, icOn: IC.homeOn, label: '首页'},
    {ic: IC.comm, icOn: IC.commOn, label: '社区'},
    {ic: IC.plus, label: '创作', center: true},
    {ic: IC.msg, icOn: IC.msgOn, label: '消息', badge: true},
    {ic: IC.profile, icOn: IC.profileOn, label: '我的'}
  ];
  var html = '<div class="tabbar">';
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var on = S.activeTab === i;
    if (t.center) {
      html += '<div class="tab-item" onclick="switchTab(' + i + ')"><div class="tab-create">' + IC.plus + '</div><span class="tab-label">创作</span></div>';
    } else {
      var icon = on ? t.icOn : t.ic;
      var badge = t.badge ? '<div class="nav-dot-wrap">' + icon + '<div class="nav-dot"></div></div>' : icon;
      html += '<div class="tab-item' + (on ? ' on' : '') + '" onclick="switchTab(' + i + ')">' + badge + '<span class="tab-label">' + t.label + '</span></div>';
    }
  }
  html += '</div>';
  return html;
}

function navbar(title, showBack, rightHtml) {
  var html = '<div class="navbar">';
  if (showBack) {
    html += '<div class="nav-back" onclick="back()">' + IC.back + '</div>';
  } else {
    html += '<div style="width:20px"></div>';
  }
  html += '<div class="nav-title">' + title + '</div>';
  html += '<div class="nav-right">' + (rightHtml || '<div style="width:20px"></div>') + '</div>';
  html += '</div>';
  return html;
}

function navbarHome() {
  return '<div class="navbar">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<img src="logo.jpg" style="width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid #F0DDB5">' +
    '<span style="font-size:17px;font-weight:600;color:#3D2817">毛崽日记</span>' +
    '</div>' +
    '<div class="nav-right">' +
    '<span onclick="nav(\'search\')" style="cursor:pointer">' + IC.search + '</span>' +
    '<span class="nav-dot-wrap" onclick="switchTab(3)" style="cursor:pointer">' + IC.bell + '<div class="nav-dot"></div></span>' +
    '</div></div>';
}

function stateBox(type, title, desc, btnText, btnFn) {
  var icons = {loading:'<div class="loading-spin" style="border-color:rgba(232,122,93,.3);border-top-color:#E87A5D"></div>',empty:'📭',error:'😵',success:'✓',network:'📡'};
  var colors = {loading:'#FAF3E8',empty:'#FAF3E8',error:'#FFE6E6',success:'#E8F5E9',network:'#FFF3E0'};
  var html = '<div class="state-box">';
  html += '<div class="state-ic" style="background:' + (colors[type]||'#FAF3E8') + '">' + (icons[type]||'') + '</div>';
  html += '<div class="state-tt">' + title + '</div>';
  if (desc) html += '<div class="state-desc">' + desc + '</div>';
  if (btnText) html += '<button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="' + btnFn + '">' + btnText + '</button>';
  html += '</div>';
  return html;
}

function styleTag(idx) {
  return '<span class="style-tag" style="color:' + S.styleColors[idx] + ';background:' + S.styleColors[idx].replace(')',',0.1)').replace('rgb','rgba').replace('#','rgba(') + '">' + S.styles[idx] + '</span>';
}

  }

    html += '<div class="upload-item add" onclick="addEditPhoto()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 6 L12 18 M6 12 L18 12" stroke="#A0815F" stroke-width="2" stroke-linecap="round"/></svg></div>';

function removeEditPhoto(idx) {
  S.editingDiary.photos.splice(idx, 1);
  render('fade');
}

function addEditPhoto() {
  var photos = ['咪咪叼拖鞋.jpg','咪咪叼拖鞋舔毛.jpg','布丁追蝴蝶1.jpg','布丁追蝴蝶2.jpg','年糕打打滚.jpg'];
  if (S.editingDiary.photos.length < 9) {
    S.editingDiary.photos.push(photos[S.editingDiary.photos.length % photos.length]);
    render('fade');
  }
}

function saveEdit() {
  if (!S.editingDiary.title.trim()) { toast('error', '标题不能为空'); return; }
  if (!S.editingDiary.text.trim()) { toast('error', '正文不能为空'); return; }
  toast('success', '修改已保存');
  setTimeout(function() { back(); }, 800);
}

    '<div class="menu-it" onclick="showModal(\'deleteConfirm\')"><div class="menu-ic" style="background:#FFEBEE">🗑️</div><div class="menu-tt" style="color:#E85D5D">清空聊天记录</div><span class="menu-arr">' + IC.arrow + '</span></div>' +
    '</div></div></div></div>';
};

render('fade');

</script>
